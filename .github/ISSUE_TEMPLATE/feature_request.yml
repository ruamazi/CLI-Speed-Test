name: Feature request
description: Suggest an improvement to the speed test
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you want to
        solve, not just the implementation. Do not include secrets or personal
        information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult, missing, or confusing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the project to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, mockups, or related issues.
